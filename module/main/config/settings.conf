# ========================================
# 救砖模块配置文件
# 修改后重启或重新执行脚本生效
# ========================================

# 时间格式（用于日志文件名和描述）
TIME_FORMAT="+%Y年%m月%d日%H:%M:%S"

# 日志目录
# 默认留空：不写日志。需要记录时在 App 的「设置 → 日志目录」里选一个目录
LOG_DIR=""

# 清理多少天前的日志
LOG_RETENTION_DAYS=1

# log.sh 日志记录时长（秒）
LOG_TIMEOUT=60

# 仅日志模式（LOG_MODE=1）抓取时长（秒）
# 注意：救砖模式（LOG_MODE>=2）已改为无超时，直到按音量键
KEY_TIMEOUT=30

# 分割线
LINE="========================================"

# 日志模式
# 0 = 完全禁用（静默模式，正式发布版）
# 1 = 仅记录日志（不检测音量键，不执行救砖）
# 2 = 日志 + 手动救砖（音量键确认）
# 3 = 日志 + 自动救砖（崩溃达阈值自动执行，也支持音量键）
LOG_MODE=0

# 自动救砖阈值（LOG_MODE>=3 时生效，达到崩溃次数自动救砖）
# 注意：替换 APK 本身可能引发一次崩溃，阈值建议 >=3
# 测试时可设很大（如 20）只观察计数不触发
FATAL_THRESHOLD=3

# 日志疯长阈值（字节/轮），单轮增长超过此值视为界面卡死
# 默认 2MB。SystemUI 正常运行时日志增长很慢
LOG_FLOOD_BYTES=2097152

# 日志文件体积上限（字节），超过后截断防止写爆存储
# 默认 50MB
LOG_MAX_BYTES=52428800

# WebUI 记住的 APK 路径（自动维护，无需手动改）
RESCUE_APK_PATH=
TARGET_APK_PATH=

# 音量键校验状态 (1=已校验 0=未校验)
VOLUME_CHECK_ASSESS=0

# 音量键设备（由 volkey.sh 实测后填写，留空则自动识别）
# 多设备用空格分隔，例如：VOL_UP_DEV="/dev/input/event4"
VOL_UP_DEV=
VOL_DOWN_DEV=

# ========================================
# 环境记录（由 check.sh 自动写入，勿手动改）
# 系统升级后如果和当前环境不一致，WebUI 会提示重新校验
# ========================================

# 校验时的安卓版本
CHECK_ANDROID_VER=

# 校验时的 SDK 版本
CHECK_ANDROID_SDK=

# 校验时的系统版本（HyperOS / MIUI）
CHECK_OS_NAME=

# 校验时的机型代号
CHECK_DEVICE=

# 校验时间
CHECK_TIME=

# 累计救砖次数
PROTECT_COUNT=0

# ========================================
# 函数定义（勿删）
# ========================================

get_time() {
    date "${TIME_FORMAT}"
}

update_desc() {
    [ -f "${MODDIR}/module.prop" ] || return 0
    sed -i "s/^description=.*/description=$1/" "${MODDIR}/module.prop" 2>/dev/null
}
