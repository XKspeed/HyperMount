name: Deploy Site

# 官网静态页：源码在 docs/，推 main 自动发到 GitHub Pages
# 注意：仓库 Settings → Pages → Source 需要选成 "GitHub Actions"（只需设一次）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'update.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，后来的排队
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 清单以仓库根的为准，避免 docs 里那份漏更新
      - name: 同步更新清单
        run: |
          set -euo pipefail
          cp update.json docs/update.json
          echo "站点版本：$(python3 -c "import json;print(json.load(open('docs/update.json'))['versionName'])")"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
