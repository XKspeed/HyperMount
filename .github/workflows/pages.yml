name: Deploy Site

# 官网：VitePress 源码在 docs/，推 main 自动构建并发到 GitHub Pages
# 站点路径前缀由 DOCS_BASE 传入（仓库页是 /<仓库名>/，自定义域名为 /）
# 注意：仓库 Settings → Pages → Source 需要选成 "GitHub Actions"（只需设一次）

on:
  workflow_dispatch:
  # 发版工作流直接复用这份（uses: ./.github/workflows/pages.yml）
  # 发版是用 GITHUB_TOKEN 推 main 的 那个 push 事件不会再触发 workflow
  # 所以只能由 Release 主动调用 否则站点会停在上一版的下载链接
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'update.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 固定取 main 最新：被 Release 复用时 github.sha 还停在这次运行开始的那一刻
          # 而版本号与 update.json 是发版过程中才推到 main 的 按默认 sha 取会拿到旧清单
          ref: main

      # 清单以仓库根的为准，站点同域提供一份给页面读版本号 / 下载地址
      - name: 同步更新清单
        run: |
          set -euo pipefail
          cp update.json docs/public/update.json
          echo "站点版本：$(python3 -c "import json;print(json.load(open('docs/public/update.json'))['versionName'])")"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install deps
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # 仓库还没开 Pages 时自动开一次（Source 会设成 GitHub Actions）
          # 已经开过的仓库这个参数是空操作
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
