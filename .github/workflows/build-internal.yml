name: Build Internal

# 只出包 不发布正式版：不建版本 tag、不动 update.json
# versionCode 每次 +1 并写回 main，保证清单的代号只涨不跌（正式发版会在此基础上再 +1）
# 产物同时放两处：运行页底部的 Artifacts（手动下载）与固定 tag `internal` 的 prerelease（App 内测通道直接拉）
# 与 Release 工作流同一套签名 装过正式版的机器可以直接覆盖安装

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App 版本号'
        required: false
        default: ''
      module_version:
        description: '模块版本号'
        required: false
        default: ''
      target:
        description: '打包内容（0=App+模块 1=只打App 2=只打模块）'
        required: false
        default: '0'

permissions:
  # 要往固定 tag `internal` 发 prerelease、还要把清单提交回 main
  contents: write

jobs:
  build:
    name: Build Release APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # 与 Release 工作流共用同一份 Gradle 缓存：
      # setup-gradle 自带缓存的 key 里含 workflow 名，两条流永远对不上，
      # 这里直接关掉它，改用下面 actions/cache 的固定 key。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 与发布流程同一套密钥：内测包和正式包签名一致 才能直接覆盖安装
      - name: Decode signing key
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat > /tmp/signing-key.b64 <<'B64_EOF'
          ${{ secrets.SIGNING_KEY }}
          B64_EOF
          B64=$(tr -d '[:space:]' < /tmp/signing-key.b64)
          echo "SIGNING_KEY 字符数（去空白后）: ${#B64}"

          if [ "${#B64}" -eq 0 ]; then
            echo "::error::SIGNING_KEY 为空 —— Secrets 里没配这个变量"
            exit 1
          fi
          if [ -z "${KEY_STORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "::error::KEY_STORE_PASSWORD / KEY_ALIAS 没配"
            exit 1
          fi
          if printf '%s' "$B64" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::SIGNING_KEY 含非 base64 字符 —— 要的是 jks 的 base64 文本"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > app/release-key.jks
          rm -f /tmp/signing-key.b64

          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 打不开或别名不对（KEY_ALIAS 应为 systemuimount）"
            exit 1
          fi
          echo "keystore 校验通过（alias=$KEY_ALIAS）"
          echo "字节数: $(wc -c < app/release-key.jks)"

      # 只改本次构建的工作区 不提交 仓库里的版本号保持不动
      # 两个版本号都可留空：留空就把 x.x.y 的 y 加 1，之后统一加 -debug
      # versionCode 一律不动：内测与正式版同号 覆盖安装不会冲突
      - name: Resolve version
        id: v
        env:
          IN_NAME: ${{ inputs.version }}
          IN_MODULE: ${{ inputs.module_version }}
          IN_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # 1.4.1 → 1.4.2
          bump_last() {
            printf '%s' "$1" | awk -F. 'BEGIN{OFS="."} NF>=2 && $NF ~ /^[0-9]+$/ { $NF=$NF+1 } { print }'
          }
          # 已经带 -debug 就别叠第二层
          mark_debug() {
            case "$1" in
              *-debug*) printf '%s' "$1" ;;
              *)         printf '%s-debug' "$1" ;;
            esac
          }

          CUR_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CUR_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          MK_NAME=$(grep '^version=' module/main/module.prop | head -1 | cut -d= -f2 | tr -d ' \r')
          MK_CODE=$(grep '^versionCode=' module/main/module.prop | head -1 | cut -d= -f2 | tr -d ' \r')

          # ---- 打包内容 ----
          # 0 全打 / 1 只打 App / 2 只打模块；没打的那一侧版本不动
          TARGET="${IN_TARGET:-0}"
          case "$TARGET" in
            0|1|2) ;;
            *) echo "::error::打包内容只能是 0 / 1 / 2"; exit 1 ;;
          esac

          # ---- App：1.4.1 → 1.4.2 → 1.4.2-debug ----
          if [ "$TARGET" = "2" ]; then
            NAME="$CUR_NAME"
            CODE="$CUR_CODE"
            echo "只打模块 App 版本保持 ${NAME}(${CODE}) 不重编"
          else
            NAME="${IN_NAME#v}"
            if [ -z "$NAME" ]; then
              NAME=$(bump_last "$CUR_NAME")
              echo "App 版本留空 自动 +1：${CUR_NAME} → ${NAME}"
            fi
            NAME=$(mark_debug "$NAME")

            # 内测代号每次 +1：清单的 versionCode 只涨不跌
            # 老版本 App 写缓存时「代号更小的清单一律不覆盖」 代号回退过一次（15 → 11）
            # 就让所有人的缓存卡在旧清单上 更新检查从此一直显示已是最新
            CODE=$((CUR_CODE + 1))

            sed -i -E "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${NAME}\"/" app/build.gradle.kts
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${CODE}/" app/build.gradle.kts
            grep -nE 'versionCode|versionName' app/build.gradle.kts
          fi

          # ---- 模块：1.5.6 → 1.5.7 → 1.5.7-debug.<构建号> ----
          if [ "$TARGET" = "1" ]; then
            BASE="$MK_NAME"
            echo "只打 App 模块版本保持 ${MK_NAME}(${MK_CODE})"
          else
            BASE="${IN_MODULE#v}"
            if [ -z "$BASE" ]; then
              BASE=$(bump_last "$MK_NAME")
              echo "模块版本留空 自动 +1：${MK_NAME} → ${BASE}"
            fi
          fi
          MNAME="$(mark_debug "$BASE").${GITHUB_RUN_NUMBER}"
          MCODE="${MK_CODE}"
          echo "App ${CUR_NAME}(${CUR_CODE}) → ${NAME}(${CODE})"
          echo "模块 ${MK_NAME}(${MK_CODE}) → ${MNAME}(${MCODE})"

          {
            echo "target=${TARGET}"
            echo "version_name=${NAME}"
            echo "version_code=${CODE}"
            # 模块基础版本：打包脚本自己拼 -debug.<构建号>
            echo "module_base=${BASE}"
            echo "module_name=${MNAME}"
            echo "module_code=${MCODE}"
            # 固定名：内测通道的下载链接要永久有效 不能带版本号
            echo "asset=HyperMount-arm64-internal.apk"
          } >> "$GITHUB_OUTPUT"

          # 构建时间戳（epoch 毫秒）：包内 BuildConfig.BUILD_TIME 与清单里的 buildTime 用同一个值
          # 内测包版本号跟正式版一样 判断谁新谁旧只能看它
          BT=$(date +%s%3N)
          echo "build_time=${BT}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=${BT}" >> "$GITHUB_ENV"
          echo "构建时间戳: ${BT}"

      - name: Build release APK
        if: steps.v.outputs.target != '2'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # 构建号写进 BuildConfig.BUILD_ID：内测包版本号跟正式版一样，
        # App 判断“有没有新内测”只能靠它
        run: ./gradlew :app:assembleRelease --no-daemon -PbuildId=${{ github.run_number }} -PbuildTime=${{ steps.v.outputs.build_time }}

      - name: Verify APK signature
        if: steps.v.outputs.target != '2'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS=$(ls -d "${SDK_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${TOOLS}" ] && [ -x "${TOOLS}apksigner" ]; then
            "${TOOLS}apksigner" verify --print-certs "${APK}"
          else
            unzip -l "${APK}" | grep -q "META-INF/.*\.RSA" || {
              echo "::error::产物未签名"
              exit 1
            }
          fi

      # 命名与发布版本一致：HyperMount-arm64-<版本>.apk
      - name: Rename APK
        if: steps.v.outputs.target != '2'
        env:
          ASSET: ${{ steps.v.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${ASSET}"
          ls -l dist
          echo "--- 打进包的 ABI ---"
          unzip -l "dist/${ASSET}" | awk '/lib\//{print $4}'

      - name: Upload APK
        if: steps.v.outputs.target != '2'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.asset }}
          path: dist/*.apk
          retention-days: 30

      # 内测也带一份模块包：模块改了不用等正式版 刷 internal 这个就行
      # 版本名带 -debug.<构建号>、versionCode 与正式版同号
      # Magisk 那边只认正式清单（只能发现正式更新）测试版更新由 App 识别
      - name: Build module zip
        id: module
        if: steps.v.outputs.target != '1'
        run: |
          set -euo pipefail
          # 传基础版本 打包脚本自己加 -debug.<构建号>
          sh module/打包.sh "${{ steps.v.outputs.module_base }}" --debug \
            --build "${GITHUB_RUN_NUMBER}"
          # 产物名带构建号（…_v1.5.7-debug.14.zip）glob 要放宽
          SRC=$(ls -1t module/dist/*-debug*.zip 2>/dev/null | head -1)
          if [ -z "${SRC}" ]; then
            echo "::error::没找到模块内测包"
            ls -l module/dist || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" dist/module-internal.zip
          MP=$(unzip -p dist/module-internal.zip module.prop)
          MV=$(printf '%s\n' "$MP" | grep '^version=' | head -1 | cut -d= -f2 | tr -d '\r')
          MC=$(printf '%s\n' "$MP" | grep '^versionCode=' | head -1 | cut -d= -f2 | tr -d '\r')
          {
            echo "module_version=${MV}"
            echo "module_code=${MC}"
          } >> "$GITHUB_OUTPUT"
          echo "模块包: v${MV}（versionCode ${MC}）"
          ls -l dist/module-internal.zip

      # 固定 tag 的 prerelease：App 的内测通道就从这里下
      # 每次先删掉整个 release 再建：保证这个 tag 下永远只有一 APK + 一模块包
      - name: Publish internal prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ASSET: ${{ steps.v.outputs.asset }}
          NAME: ${{ steps.v.outputs.version_name }}
          CODE: ${{ steps.v.outputs.version_code }}
          BUILD: ${{ github.run_number }}
          BT: ${{ steps.v.outputs.build_time }}
          TARGET: ${{ steps.v.outputs.target }}
          MODULE_NAME: ${{ steps.module.outputs.module_version }}
        run: |
          set -euo pipefail
          # 打包时间和构建号：内测包版本号可能跟正式版一样 只有这两样能区分谁是谁
          # 统一按北京时间写 免得用户在别的时区对着 UTC 算
          PUBLISHED=$(TZ=Asia/Shanghai date -d "@$((BT / 1000))" "+%Y-%m-%d %H:%M")
          printf '内测版 · 构建 %s · 发布于 %s（北京时间）\n' "$BUILD" "$PUBLISHED" > /tmp/internal-head.txt
          # 发版说明直接取 update.md 的 ## latest：这一版到底改了什么以它为准
          # 列表项前面的 ### 分组标题留着 发版页上能正常显示成小标题
          if sh scripts/changelog.sh has update.md latest; then
            sh scripts/changelog.sh extract update.md latest > /tmp/internal-latest.md
          else
            : > /tmp/internal-latest.md
          fi
          # 头部单独一行引用块：一眼看出这是测试包 什么时候打的
          {
            printf '> %s\n\n' "$(cat /tmp/internal-head.txt)"
            cat /tmp/internal-latest.md
          } > /tmp/internal-notes.md
          cat /tmp/internal-notes.md
          gh release delete internal --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          # 只打一侧时另一个产物不存在 传不存在的路径 gh 会直接报错
          FILES=()
          if [ "$TARGET" != "2" ]; then FILES+=("dist/${ASSET}"); fi
          if [ "$TARGET" != "1" ]; then FILES+=("dist/module-internal.zip"); fi
          if [ "$TARGET" = "2" ]; then TITLE="内测模块 ${MODULE_NAME}"; else TITLE="内测版 ${NAME}"; fi
          gh release create internal "${FILES[@]}" \
            --repo "$REPO" \
            --prerelease \
            --title "${TITLE}" \
            --notes-file /tmp/internal-notes.md
          COUNT=$(gh release view internal --repo "$REPO" --json assets --jq '.assets | length')
          echo "internal 下的资产数：${COUNT}"
          if [ "${COUNT}" -ne "${#FILES[@]}" ]; then
            echo "::error::internal 下应该有 ${#FILES[@]} 个资产 实际是 ${COUNT} 个"
            exit 1
          fi

      # 清单里的构建号就是这次的 run number：App 拿它跟手上那份比 不同就算有内测更新
      - name: Write internal manifest
        env:
          REPO: ${{ github.repository }}
          NAME: ${{ steps.v.outputs.version_name }}
          CODE: ${{ steps.v.outputs.version_code }}
          BUILD: ${{ github.run_number }}
          BT: ${{ steps.v.outputs.build_time }}
          MVN: ${{ steps.module.outputs.module_version }}
          MC: ${{ steps.module.outputs.module_code }}
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          set -euo pipefail
          # 更新说明与发版页同一份内容（上一步已经落到 /tmp/internal-latest.md）
          # 应用内的更新卡片是逐行纯文本渲染：### 分组标题会原样显示成一条内容 这里去掉
          # 只打模块时 App 没发版：不取 update.md，避免把上一版的日志又贴一遍
          if [ "$TARGET" != "2" ]; then
            [ -f /tmp/internal-latest.md ] || sh scripts/changelog.sh extract update.md latest > /tmp/internal-latest.md
            sed -E '/^[[:space:]]*###/d; s/^[-*][[:space:]]*//' /tmp/internal-latest.md \
              > /tmp/internal-changelog.txt
          else
            : > /tmp/internal-changelog.txt
          fi
          URL="https://github.com/${REPO}/releases/download/internal/HyperMount-arm64-internal.apk"
          MURL="https://github.com/${REPO}/releases/download/internal/module-internal.zip"
          export URL MURL
          # 模块这版改了什么：取 module/main/update.md 的 latest 段
          if [ "$TARGET" != "1" ] && sh scripts/changelog.sh has module/main/update.md latest; then
            sh scripts/changelog.sh extract module/main/update.md latest > /tmp/internal-module-latest.md
            sed -E '/^[[:space:]]*###/d; s/^[-*][[:space:]]*//' /tmp/internal-module-latest.md \
              > /tmp/internal-module-changelog.txt
          else
            : > /tmp/internal-module-changelog.txt
          fi
          python3 - <<'PY'
          import hashlib, json, os

          def lines(path):
              return [l.strip() for l in open(path, encoding="utf-8") if l.strip()]

          def sha256_of(path):
              """App 下载器下完要拿这个值比对：内测走的镜像更多 更需要验"""
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          # 只打一侧时另一侧字段原样保留：清单是两边的最新快照 清空会让另一条通道的提示消失
          current = {}
          if os.path.exists("update-internal.json"):
              try:
                  current = json.load(open("update-internal.json", encoding="utf-8"))
              except Exception:
                  current = {}
          target = os.environ["TARGET"]
          data = dict(current)
          if target != "2":
              data.update({
                  "versionCode": int(os.environ["CODE"]),
                  "versionName": os.environ["NAME"],
                  # 构建时间戳：App 拿它跟手上那份比先后 比手上这份晚才算有更新
                  "buildTime": int(os.environ["BT"]),
                  "buildId": os.environ["BUILD"],
                  "url": os.environ["URL"],
                  "changelog": "\n".join(lines("/tmp/internal-changelog.txt")),
              })
              # 安装包摘要：App 下载器下完对一遍
              apk = "dist/HyperMount-arm64-internal.apk"
              if os.path.exists(apk):
                  data["sha256"] = sha256_of(apk)
          if target != "1":
              data.update({
                  # 内测也带模块：App 的内测通道直接读这几项 不用再回正式清单里找
                  "moduleVersionCode": int(os.environ["MC"]),
                  "moduleVersionName": os.environ["MVN"],
                  "moduleUrl": os.environ["MURL"],
                  "moduleChangelog": "\n".join(lines("/tmp/internal-module-changelog.txt")),
              })
              mzip = "dist/module-internal.zip"
              if os.path.exists(mzip):
                  data["moduleSha256"] = sha256_of(mzip)
          with open("update-internal.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open("update-internal.json", encoding="utf-8").read())

          PY

      - name: Commit internal manifest
        env:
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只把 +1 后的 versionCode 带回 main：versionName 上的 -debug 是这次构建专用的
          # 留着会让仓库里的版本名一直挂着测试后缀
          CUR_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          sed -i "s/versionName = \"${CUR_NAME}\"/versionName = \"${CUR_NAME%-debug}\"/" app/build.gradle.kts
          git add update-internal.json app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "清单与版本号没有变化 跳过提交"
            exit 0
          fi
          git commit -m "chore(internal): 内测清单指向构建 ${BUILD}"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "内测清单已推送到 main"
              exit 0
            fi
            echo "推送被拒 第 ${i} 次重试…"
            git fetch origin main
            git rebase --autostash FETCH_HEAD
          done
          echo "::error::内测清单推送失败"
          exit 1

      - name: Summary
        env:
          ASSET: ${{ steps.v.outputs.asset }}
          NAME: ${{ steps.v.outputs.version_name }}
          CODE: ${{ steps.v.outputs.version_code }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.v.outputs.target }}
          MODULE_NAME: ${{ steps.module.outputs.module_version }}
        run: |
          {
            if [ "$TARGET" = "2" ]; then
              echo "## 内测模块 ${MODULE_NAME} · 构建 ${BUILD}（只打模块）"
            elif [ "$TARGET" = "1" ]; then
              echo "## 内测包 ${NAME} (${CODE}) · 构建 ${BUILD}（只打 App）"
            else
              echo "## 内测包 ${NAME} (${CODE}) · 构建 ${BUILD}"
            fi
            echo ""
            echo "已发到固定 tag \`internal\` 的 prerelease，应用里把「更新来源」切到内测版就能收到："
            echo ""
            if [ "$TARGET" != "2" ]; then
              echo "https://github.com/${REPO}/releases/download/internal/${ASSET}"
              echo ""
            fi
            if [ "$TARGET" != "1" ]; then
              echo "模块内测包（版本名带 \`-debug.<构建号>\`，Magisk 里只查正式更新）："
              echo ""
              echo "https://github.com/${REPO}/releases/download/internal/module-internal.zip"
              echo ""
            fi
            echo "本次运行页底部 **Artifacts** 也能手动下载。"
            echo ""
            echo "- 只有 arm64-v8a"
            echo "- 与正式包同一签名 可直接覆盖安装"
            echo "- 模块内测包 versionCode 与正式版同号 测试版更新只在 App 里提示"
            echo "- 不改 update.json；提交内测清单与 +1 后的 versionCode"
            echo "- \`internal\` 下每次构建先删再建 只放这次打出来的产物"
          } >> "$GITHUB_STEP_SUMMARY"
