name: Build Internal

# 只出包 不发布正式版：不建版本 tag、不动 update.json、不提交版本号
# 产物同时放两处：运行页底部的 Artifacts（手动下载）与固定 tag `internal` 的 prerelease（App 内测通道直接拉）
# 与 Release 工作流同一套签名 装过正式版的机器可以直接覆盖安装

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName（如 1.2.2-beta.1；留空沿用 build.gradle.kts）'
        required: false
        default: ''
      version_code:
        description: 'versionCode：可填 +1 这种相对写法 也可填纯数字；留空沿用'
        required: false
        default: ''

permissions:
  # 要往固定 tag `internal` 发 prerelease、还要把清单提交回 main
  contents: write

jobs:
  build:
    name: Build Release APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # 与 Release 工作流共用同一份 Gradle 缓存：
      # setup-gradle 自带缓存的 key 里含 workflow 名，两条流永远对不上，
      # 这里直接关掉它，改用下面 actions/cache 的固定 key。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 与发布流程同一套密钥：内测包和正式包签名一致 才能直接覆盖安装
      - name: Decode signing key
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat > /tmp/signing-key.b64 <<'B64_EOF'
          ${{ secrets.SIGNING_KEY }}
          B64_EOF
          B64=$(tr -d '[:space:]' < /tmp/signing-key.b64)
          echo "SIGNING_KEY 字符数（去空白后）: ${#B64}"

          if [ "${#B64}" -eq 0 ]; then
            echo "::error::SIGNING_KEY 为空 —— Secrets 里没配这个变量"
            exit 1
          fi
          if [ -z "${KEY_STORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "::error::KEY_STORE_PASSWORD / KEY_ALIAS 没配"
            exit 1
          fi
          if printf '%s' "$B64" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::SIGNING_KEY 含非 base64 字符 —— 要的是 jks 的 base64 文本"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > app/release-key.jks
          rm -f /tmp/signing-key.b64

          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 打不开或别名不对（KEY_ALIAS 应为 systemuimount）"
            exit 1
          fi
          echo "keystore 校验通过（alias=$KEY_ALIAS）"
          echo "字节数: $(wc -c < app/release-key.jks)"

      # 只改本次构建的工作区 不提交 仓库里的版本号保持不动
      - name: Resolve version
        id: v
        env:
          IN_NAME: ${{ inputs.version }}
          IN_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          NAME="${IN_NAME#v}"
          if [ -z "$NAME" ]; then
            NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
            echo "未填版本名 沿用 ${NAME}"
          fi
          CUR_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          CODE="${IN_CODE}"
          if [ -z "$CODE" ]; then
            CODE="$CUR_CODE"
            echo "未填 versionCode 沿用 ${CODE}"
          elif printf '%s' "$CODE" | grep -qE '^\+[0-9]+$'; then
            CODE=$((CUR_CODE + ${CODE#+}))
            echo "versionCode 相对写法 ${IN_CODE}：${CUR_CODE} → ${CODE}"
          elif printf '%s' "$CODE" | grep -qE '^[0-9]+$'; then
            echo "versionCode 指定为 ${CODE}"
          else
            echo "::error::versionCode 只能是 +1 这种相对写法或纯数字：${CODE}"
            exit 1
          fi

          sed -i -E "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${NAME}\"/" app/build.gradle.kts
          sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${CODE}/" app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts

          {
            echo "version_name=${NAME}"
            echo "version_code=${CODE}"
            # 固定名：内测通道的下载链接要永久有效 不能带版本号
            echo "asset=HyperMount-arm64-internal.apk"
          } >> "$GITHUB_OUTPUT"

          # 构建时间戳（epoch 毫秒）：包内 BuildConfig.BUILD_TIME 与清单里的 buildTime 用同一个值
          # 内测包版本号跟正式版一样 判断谁新谁旧只能看它
          BT=$(date +%s%3N)
          echo "build_time=${BT}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=${BT}" >> "$GITHUB_ENV"
          echo "构建时间戳: ${BT}"

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # 构建号写进 BuildConfig.BUILD_ID：内测包版本号跟正式版一样，
        # App 判断“有没有新内测”只能靠它
        run: ./gradlew :app:assembleRelease --no-daemon -PbuildId=${{ github.run_number }} -PbuildTime=${{ steps.v.outputs.build_time }}

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS=$(ls -d "${SDK_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${TOOLS}" ] && [ -x "${TOOLS}apksigner" ]; then
            "${TOOLS}apksigner" verify --print-certs "${APK}"
          else
            unzip -l "${APK}" | grep -q "META-INF/.*\.RSA" || {
              echo "::error::产物未签名"
              exit 1
            }
          fi

      # 命名与发布版本一致：HyperMount-arm64-<版本>.apk
      - name: Rename APK
        env:
          ASSET: ${{ steps.v.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${ASSET}"
          ls -l dist
          echo "--- 打进包的 ABI ---"
          unzip -l "dist/${ASSET}" | awk '/lib\//{print $4}'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.asset }}
          path: dist/*.apk
          retention-days: 30

      # 固定 tag 的 prerelease：App 的内测通道就从这里下
      # 每次先删掉整个 release 再建：保证这个 tag 下永远只有一个 APK 不会越堆越多
      - name: Publish internal prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ASSET: ${{ steps.v.outputs.asset }}
          NAME: ${{ steps.v.outputs.version_name }}
          CODE: ${{ steps.v.outputs.version_code }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release delete internal --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create internal "dist/${ASSET}" \
            --repo "$REPO" \
            --prerelease \
            --title "内测版 ${NAME}" \
            --notes "构建 ${BUILD} · 版本 ${NAME} (${CODE})"
          COUNT=$(gh release view internal --repo "$REPO" --json assets --jq '.assets | length')
          echo "internal 下的资产数：${COUNT}"
          if [ "${COUNT}" -ne 1 ]; then
            echo "::error::internal 下应该只有一个 APK 实际是 ${COUNT} 个"
            exit 1
          fi

      # 清单里的构建号就是这次的 run number：App 拿它跟手上那份比 不同就算有内测更新
      - name: Write internal manifest
        env:
          REPO: ${{ github.repository }}
          NAME: ${{ steps.v.outputs.version_name }}
          CODE: ${{ steps.v.outputs.version_code }}
          BUILD: ${{ github.run_number }}
          BT: ${{ steps.v.outputs.build_time }}
        run: |
          set -euo pipefail
          # 更新说明取 update.md 的 ## latest：内测包里到底有什么改动 以它为准
          sh scripts/changelog.sh extract update.md latest 2>/dev/null \
            | sed -E '/^[[:space:]]*###/d; s/^-[[:space:]]*//' \
            > /tmp/internal-changelog.txt || true
          URL="https://github.com/${REPO}/releases/download/internal/HyperMount-arm64-internal.apk"
          export URL
          python3 - <<'PY'
          import json, os

          lines = [l.strip() for l in open("/tmp/internal-changelog.txt", encoding="utf-8") if l.strip()]
          data = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": os.environ["NAME"],
              # 构建时间戳：App 拿它跟手上那份比先后 比手上这份晚才算有更新
              "buildTime": int(os.environ["BT"]),
              "buildId": os.environ["BUILD"],
              "url": os.environ["URL"],
              "changelog": "\n".join(lines),
          }
          with open("update-internal.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open("update-internal.json", encoding="utf-8").read())
          PY

      - name: Commit internal manifest
        env:
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update-internal.json
          if git diff --cached --quiet; then
            echo "清单没有变化 跳过提交"
            exit 0
          fi
          git commit -m "chore(internal): 内测清单指向构建 ${BUILD}"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "内测清单已推送到 main"
              exit 0
            fi
            echo "推送被拒 第 ${i} 次重试…"
            git fetch origin main
            git rebase --autostash FETCH_HEAD
          done
          echo "::error::内测清单推送失败"
          exit 1

      - name: Summary
        env:
          ASSET: ${{ steps.v.outputs.asset }}
          NAME: ${{ steps.v.outputs.version_name }}
          CODE: ${{ steps.v.outputs.version_code }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## 内测包 ${NAME} (${CODE}) · 构建 ${BUILD}"
            echo ""
            echo "已发到固定 tag \`internal\` 的 prerelease，应用里把「更新来源」切到内测版就能收到："
            echo ""
            echo "https://github.com/${REPO}/releases/download/internal/${ASSET}"
            echo ""
            echo "本次运行页底部 **Artifacts** 也能手动下载。"
            echo ""
            echo "- 只有 arm64-v8a"
            echo "- 与正式包同一签名 可直接覆盖安装"
            echo "- 不改 update.json、不提交版本号；只提交 update-internal.json"
            echo "- \`internal\` 下始终只有一个 APK（每次构建先删再建）"
          } >> "$GITHUB_STEP_SUMMARY"
