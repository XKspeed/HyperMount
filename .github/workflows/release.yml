name: Release

on:
  # 只手动触发：一键发布 —— Actions 页面点 Run workflow
  # 不挂 push / tag 触发 避免每次提交都发一个 Release
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1 / 1.2.0-hotfix1，可带 v）；留空沿用 build.gradle.kts 现有版本 不改动'
        required: false
        default: ''
      version_code:
        description: 'versionCode：可填 +1 这种相对写法 也可填纯数字；留空则版本名变化时自动 +1'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 关掉 setup-gradle 自带的缓存：它的 key 里带 workflow 名，
      # 两条工作流（Release / Build Internal）永远不会命中同一份。
      # 缓存改由下一步 actions/cache 统一管，key 里只有 Gradle 版本，两边共用。
      # 注意：v4 这个 tag 上没有 cache-provider 输入（只有 main 分支有），
      # 写 cache-provider 会报 Unexpected input 并按默认 enhanced 继续跑。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          # 只有 Gradle 版本变化才换 key；版本号写在 build.gradle 里不参与计算，
          # 否则每次发版 sed 改一下 versionName 就会整份缓存作废。
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 把 Secrets 里的 keystore（jks 的 base64 单行文本）解码回文件
      # 解码后立刻按别名校验：内容不对时在这一步就报明确错误
      # 而不是等到 packageRelease 才抛难懂的"Tag number over 30 is not supported"
      - name: Decode signing key
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 先落盘再解码：容忍复制时混入的换行/空格 也避免密钥内容被 shell 解释
          cat > /tmp/signing-key.b64 <<'B64_EOF'
          ${{ secrets.SIGNING_KEY }}
          B64_EOF
          B64=$(tr -d '[:space:]' < /tmp/signing-key.b64)
          # 下面只打印元信息（长度/字节数） 绝不打印密钥内容本身
          echo "SIGNING_KEY 字符数（去空白后）: ${#B64}"

          # ① 变量是否配了
          if [ "${#B64}" -eq 0 ]; then
            echo "::error::SIGNING_KEY 为空 —— Secrets 里没配这个变量（或名字不一致）"
            exit 1
          fi
          if [ -z "${KEY_STORE_PASSWORD}" ]; then
            echo "::error::KEY_STORE_PASSWORD 为空 —— Secrets 里没配 应为 SysUI@Mount2026"
            exit 1
          fi
          if [ -z "${KEY_ALIAS}" ]; then
            echo "::error::KEY_ALIAS 为空 —— Secrets 里没配 应为 systemuimount"
            exit 1
          fi

          # ② 内容是否像 base64（粘了 jks 二进制会在这里露馅）
          if printf '%s' "$B64" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::SIGNING_KEY 含有非 base64 字符 —— 多半把 jks 二进制内容粘进去了 必须是「jks 文件的 base64 文本」"
            exit 1
          fi

          # ③ 解码
          printf '%s' "$B64" | base64 -d > app/release-key.jks
          echo "解码后字节数: $(wc -c < app/release-key.jks)（正确应为 2758）"
          rm -f /tmp/signing-key.b64

          # ④ 格式 + store 密码（这一步失败 = 产物损坏 或 storePassword 不对）
          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::keystore 打不开 —— 要么解码产物不完整（SIGNING_KEY 被截断） 要么 KEY_STORE_PASSWORD 不对（应为 SysUI@Mount2026）"
            exit 1
          fi

          # ⑤ 别名是否存在（能打开但别名不对 = KEY_ALIAS 填错）
          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 能打开 但找不到别名 $KEY_ALIAS —— KEY_ALIAS 应为 systemuimount"
            exit 1
          fi
          echo "keystore 校验通过（alias=$KEY_ALIAS）"

      # 解析版本号：
      #  · 填了且与现有版本不同 → 用它（下一步自动改 versionName 并递增 versionCode）
      #  · 填的和现有版本一样 → 不再递增 versionCode 直接复用（重发同一版不虚增版本号）
      #  · 留空 → 沿用 build.gradle.kts 现有 versionName 不改任何文件
      # 版本号解析：
      #  · version 留空沿用现有 versionName；填了必须是 x.y.z 或带后缀
      #  · version_code 留空按老规则（版本名变了就 +1，没变不动）
      #    支持 "+1" / "+2" 这种相对写法，也支持纯数字绝对值
      - name: Resolve version
        id: version
        env:
          IN_NAME: ${{ github.event.inputs.version }}
          IN_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -euo pipefail
          NAME="${IN_NAME#v}"
          CUR_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CUR_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)

          if [ -z "$NAME" ]; then
            NAME="$CUR_NAME"
            echo "未填版本号 沿用现有 versionName: ${NAME}"
          elif ! printf '%s' "$NAME" | grep -qE '^[0-9]+(\.[0-9]+)+([-.+][0-9A-Za-z]+)*$'; then
            # 允许正式版 1.2.1，也允许 1.2.0-hotfix1 / 1.2.0-beta.2 这种后缀
            echo "::error::版本号格式不对：${NAME}（支持 1.0.1 / 1.2.0-hotfix1 / 1.2.0-beta.2）"
            exit 1
          fi

          if [ -z "$IN_CODE" ]; then
            if [ "$NAME" = "$CUR_NAME" ]; then
              CODE="$CUR_CODE"
            else
              CODE=$((CUR_CODE + 1))
              echo "版本名有变化 未指定 versionCode 自动 ${CUR_CODE} → ${CODE}"
            fi
          elif printf '%s' "$IN_CODE" | grep -qE '^\+[0-9]+$'; then
            CODE=$((CUR_CODE + ${IN_CODE#+}))
            echo "versionCode 相对写法 ${IN_CODE}：${CUR_CODE} → ${CODE}"
          elif printf '%s' "$IN_CODE" | grep -qE '^[0-9]+$'; then
            CODE="$IN_CODE"
            echo "versionCode 指定为 ${CODE}"
          else
            echo "::error::version_code 只能是 +1 这种相对写法或纯数字：${IN_CODE}"
            exit 1
          fi

          if [ "$NAME" = "$CUR_NAME" ] && [ "$CODE" = "$CUR_CODE" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "版本名与 versionCode 都没变 不改文件"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "将改为 versionName=${NAME} versionCode=${CODE}"
          fi
          {
            echo "version_name=${NAME}"
            echo "version_code=${CODE}"
            echo "tag=v${NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "目标版本: ${NAME}（versionCode ${CODE} tag v${NAME}）"

      # 改版本号：versionName 与 versionCode 都用上一步算好的值
      # versionCode 必须递增 否则新包装不上（覆盖安装会失败）
      - name: Bump version in build.gradle.kts
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          sed -i -E "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${VERSION}\"/" "$FILE"
          sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${CODE}/" "$FILE"
          echo "versionName -> ${VERSION} versionCode -> ${CODE}"
          grep -nE 'versionCode|versionName' "$FILE"

      # 密码通过环境变量传给 Gradle（build.gradle.kts 读取）
      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # 确认密钥真的用上了：没签名的包也能构建出来 只有验证过才算数
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS=$(ls -d "${SDK_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${TOOLS}" ] && [ -x "${TOOLS}apksigner" ]; then
            "${TOOLS}apksigner" verify --print-certs "${APK}"
            echo "apksigner 验证通过"
          else
            # 没有 apksigner 时退化为检查 Jar 签名块
            if ! unzip -l "${APK}" | grep -q "META-INF/.*\.RSA"; then
              echo "::error::产物未签名（缺少 META-INF/*.RSA）"
              exit 1
            fi
            echo "签名校验通过（存在 META-INF/*.RSA）"
          fi

      # 产物改名：SystemUIRescue-arm64-<版本>.apk
      # 签名校验用未改名的原文件 校验通过后再复制成发布用的名字
      - name: Rename APK
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/SystemUIRescue-arm64-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "发布产物: ${OUT}"
          ls -l "$OUT"

      # 构建成功后再提交版本号改动 避免构建失败留下一半的脏提交
      - name: Commit version bump
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet app/build.gradle.kts; then
            echo "build.gradle.kts 无变化（可能本来就是该版本） 跳过提交"
            exit 0
          fi
          git add app/build.gradle.kts
          git commit -m "chore(release): 版本号 ${VERSION}"
          git push origin HEAD:main

      # 幂等：同一版本一键重发时 先删掉旧 tag 再打新的
      - name: Create / update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}" 2>/dev/null || true
            git tag -d "${TAG}" 2>/dev/null || true
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      # 本次 Release 说明取自 update.md 顶部最新一段：
      # update.md 由我们维护 —— 新版本内容写在文件顶部 历史段落自然下移留档
      # 工作流只取顶部那一段 保证每个 Release 只描述自己这个版本
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          # 默认空说明：update.md 为空时（例如首个正式版不写更新日志） Release 说明就留空
          : > release_notes.md
          if [ -s update.md ]; then
            # 顶部标题与目标版本不一致时提醒：多半是忘了在 update.md 写本次更新
            TOP=$(head -1 update.md)
            if [ "$TOP" != "## v${VERSION} 更新" ]; then
              echo "::warning::update.md 顶部是「${TOP}」 与目标版本 v${VERSION} 不一致 —— Release 说明可能不是这个版本的"
            fi
            awk '/^## /{c++} c==1' update.md > release_notes.md
          fi
          if [ -s release_notes.md ]; then
            echo "--- 本次 Release 说明 ---"
            cat release_notes.md
          else
            echo "update.md 为空 本次 Release 不写更新说明"
          fi

      # 构建完直接发布 Release 附带签名 APK
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          files: dist/SystemUIRescue-arm64-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布完把仓库根的 update.json 指到这次 Release
      # App 启动检查更新读的就是 main 上这份清单：
      # versionCode 取 build.gradle.kts（已经 bump 过） 地址直接拼本次 tag 的 APK 资产
      # changelog 从刚生成的 release_notes.md 里去掉标题和列表符号
      - name: Update update.json
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          URL="https://github.com/${REPO}/releases/download/${TAG}/SystemUIRescue-arm64-${VERSION}.apk"
          export CODE URL
          python3 - <<'PY'
          import json, os, re

          lines = []
          if os.path.exists("release_notes.md"):
              for raw in open("release_notes.md", encoding="utf-8"):
                  s = raw.strip()
                  if not s or s.startswith("#"):
                      continue
                  lines.append(re.sub(r"^[-*]\s+", "", s))

          data = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": os.environ["VERSION"],
              "url": os.environ["URL"],
              "changelog": "\n".join(lines),
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open("update.json", encoding="utf-8").read())
          PY
          # 官网也是读同一份清单：页面上「下载 / 版本号」都从这里取
          # 放在 docs 下 站点同域请求 不受 GitHub 直连影响
          cp update.json docs/update.json

      # 清单改动提交回 main：推送被拒（别人刚好也推了）就 rebase 重试
      - name: Commit update.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json docs/update.json
          if git diff --cached --quiet; then
            echo "update.json 没有变化 跳过提交"
            exit 0
          fi
          git commit -m "chore(release): update.json 指向 ${TAG}"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "update.json 已推送到 main"
              exit 0
            fi
            echo "推送被拒 第 ${i} 次重试…"
            # 用 rebase 而不是 pull：checkout 可能是 detached HEAD pull 会直接报错
            git fetch origin main
            git rebase --autostash FETCH_HEAD
          done
          echo "::error::update.json 推送失败"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemUIRescue-arm64
          path: dist/SystemUIRescue-arm64-*.apk
