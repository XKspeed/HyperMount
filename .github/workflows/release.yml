name: Release

on:
  # 只手动触发：一键发布 —— Actions 页面点 Run workflow
  # 不挂 push / tag 触发 避免每次提交都发一个 Release
  workflow_dispatch:
    inputs:
      version:
        description: 'App 版本号（如 1.0.1 / 1.2.0-hotfix1，可带 v）；留空沿用 build.gradle.kts 现有版本'
        required: false
        default: ''
      module_version:
        description: '模块版本号（如 1.5.4 / 1.6.0）；留空沿用 module/main/module.prop 现有版本'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # 关掉 setup-gradle 自带的缓存：它的 key 里带 workflow 名，
      # 两条工作流（Release / Build Internal）永远不会命中同一份。
      # 缓存改由下一步 actions/cache 统一管，key 里只有 Gradle 版本，两边共用。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          # 只有 Gradle 版本变化才换 key；版本号写在 build.gradle 里不参与计算，
          # 否则每次发版 sed 改一下 versionName 就会整份缓存作废。
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 把 Secrets 里的 keystore（jks 的 base64 单行文本）解码回文件
      # 解码后立刻按别名校验：内容不对时在这一步就报明确错误
      # 而不是等到 packageRelease 才抛难懂的"Tag number over 30 is not supported"
      - name: Decode signing key
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 先落盘再解码：容忍复制时混入的换行/空格 也避免密钥内容被 shell 解释
          cat > /tmp/signing-key.b64 <<'B64_EOF'
          ${{ secrets.SIGNING_KEY }}
          B64_EOF
          B64=$(tr -d '[:space:]' < /tmp/signing-key.b64)
          # 下面只打印元信息（长度/字节数） 绝不打印密钥内容本身
          echo "SIGNING_KEY 字符数（去空白后）: ${#B64}"

          # ① 变量是否配了
          if [ "${#B64}" -eq 0 ]; then
            echo "::error::SIGNING_KEY 为空 —— Secrets 里没配这个变量（或名字不一致）"
            exit 1
          fi
          if [ -z "${KEY_STORE_PASSWORD}" ]; then
            echo "::error::KEY_STORE_PASSWORD 为空 —— Secrets 里没配 应为 SysUI@Mount2026"
            exit 1
          fi
          if [ -z "${KEY_ALIAS}" ]; then
            echo "::error::KEY_ALIAS 为空 —— Secrets 里没配 应为 systemuimount"
            exit 1
          fi

          # ② 内容是否像 base64（粘了 jks 二进制会在这里露馅）
          if printf '%s' "$B64" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::SIGNING_KEY 含有非 base64 字符 —— 多半把 jks 二进制内容粘进去了 必须是「jks 文件的 base64 文本」"
            exit 1
          fi

          # ③ 解码
          printf '%s' "$B64" | base64 -d > app/release-key.jks
          echo "解码后字节数: $(wc -c < app/release-key.jks)（正确应为 2758）"
          rm -f /tmp/signing-key.b64

          # ④ 格式 + store 密码（这一步失败 = 产物损坏 或 storePassword 不对）
          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::keystore 打不开 —— 要么解码产物不完整（SIGNING_KEY 被截断） 要么 KEY_STORE_PASSWORD 不对（应为 SysUI@Mount2026）"
            exit 1
          fi

          # ⑤ 别名是否存在（能打开但别名不对 = KEY_ALIAS 填错）
          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 能打开 但找不到别名 $KEY_ALIAS —— KEY_ALIAS 应为 systemuimount"
            exit 1
          fi
          echo "keystore 校验通过（alias=$KEY_ALIAS）"

      # App 与模块的版本一起解析，规则相同：
      #  · 留空      → 沿用现有版本，不改任何文件
      #  · 比现有高  → 代号 +1
      #  · 比现有低  → 代号不动（回退版本不虚增）
      #  · 完全一样  → 代号不动（重发同一版）
      #  · 数字段相同但名字不同（1.3.0 → 1.3.0-hotfix1）→ 也算新版本，代号 +1
      - name: Resolve version
        id: version
        env:
          IN_NAME: ${{ github.event.inputs.version }}
          IN_MODULE: ${{ github.event.inputs.module_version }}
        run: |
          set -euo pipefail

          # 只取前导数字段：1.3.0-hotfix1 → 1.3.0；1.5.4 → 1.5.4
          num() { printf '%s' "$1" | sed -E 's/^[vV]//; s/^[^0-9]*//; s/[^0-9.].*$//'; }
          # 数字段之后的后缀：1.3.0-hotfix1 → -hotfix1；1.5.4 → 空
          suf() { printf '%s' "$1" | sed -E 's/^[vV]//; s/^[0-9.]+//'; }

          # 逐段比较，打印 gt / lt / eq
          # 数字段相同再比后缀：空后缀比带后缀的旧（1.3.0 < 1.3.0-hotfix1）
          cmp_ver() {
            awk -v a="$(num "$1")" -v b="$(num "$2")" \
                -v sa="$(suf "$1")" -v sb="$(suf "$2")" 'BEGIN{
              n = split(a, A, "."); m = split(b, B, ".");
              k = (n > m) ? n : m;
              for (i = 1; i <= k; i++) {
                x = (i <= n && A[i] != "") ? A[i] + 0 : 0;
                y = (i <= m && B[i] != "") ? B[i] + 0 : 0;
                if (x > y) { print "gt"; exit }
                if (x < y) { print "lt"; exit }
              }
              if (sa == sb) { print "eq"; exit }
              if (sa == "") { print "lt"; exit }
              if (sb == "") { print "gt"; exit }
              print (sa < sb) ? "lt" : "gt";
            }'
          }

          # $1 新名 $2 旧名 $3 旧代号 → 新代号
          next_code() {
            printf '%s' "$3" | grep -qE '^[0-9]+$' || { echo 1; return; }
            if [ "$1" = "$2" ]; then echo "$3"; return; fi
            case "$(cmp_ver "$1" "$2")" in
              lt) echo "$3" ;;
              *)  echo $(( $3 + 1 )) ;;
            esac
          }

          CK_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CK_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          MK_NAME=$(grep '^version=' module/main/module.prop | head -1 | cut -d= -f2 | tr -d ' \r')
          MK_CODE=$(grep '^versionCode=' module/main/module.prop | head -1 | cut -d= -f2 | tr -d ' \r')

          # ---- App ----
          NAME="${IN_NAME#v}"
          if [ -z "$NAME" ]; then
            NAME="$CK_NAME"
            echo "App 版本留空，沿用 ${NAME}"
          elif ! printf '%s' "$NAME" | grep -qE '^[0-9]+(\.[0-9]+)+([-.+][0-9A-Za-z.]+)*$'; then
            echo "::error::App 版本号格式不对：${NAME}（支持 1.0.1 / 1.2.0-hotfix1 / 1.2.0-beta.2）"
            exit 1
          fi
          CODE=$(next_code "$NAME" "$CK_NAME" "${CK_CODE:-0}")
          if [ "$NAME" = "$CK_NAME" ] && [ "$CODE" = "$CK_CODE" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "App 版本名与代号都没变"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "App ${CK_NAME}(${CK_CODE}) → ${NAME}(${CODE})"
          fi

          # ---- 模块 ----
          MNAME="${IN_MODULE#v}"
          if [ -z "$MNAME" ]; then
            MNAME="$MK_NAME"
            echo "模块版本留空，沿用 ${MNAME}"
          elif ! printf '%s' "$MNAME" | grep -qE '^[0-9]+(\.[0-9]+)+([-.+][0-9A-Za-z.]+)*$'; then
            echo "::error::模块版本号格式不对：${MNAME}（支持 1.5.4 / 1.6.0-beta.1）"
            exit 1
          fi
          MCODE=$(next_code "$MNAME" "$MK_NAME" "${MK_CODE:-0}")
          if [ "$MNAME" = "$MK_NAME" ] && [ "$MCODE" = "$MK_CODE" ]; then
            echo "module_bump=false" >> "$GITHUB_OUTPUT"
            echo "模块版本名与代号都没变"
          else
            echo "module_bump=true" >> "$GITHUB_OUTPUT"
            echo "模块 ${MK_NAME}(${MK_CODE}) → ${MNAME}(${MCODE})"
          fi

          {
            echo "version_name=${NAME}"
            echo "version_code=${CODE}"
            echo "tag=v${NAME}"
            echo "module_name=${MNAME}"
            echo "module_code=${MCODE}"
          } >> "$GITHUB_OUTPUT"

          # 构建时间戳（epoch 毫秒）：写进包内 BuildConfig.BUILD_TIME，清单里带同一个值
          # App 检查更新靠它分先后 —— 内测包与正式版共用 versionCode 版本号分不出谁新
          BT=$(date +%s%3N)
          echo "build_time=${BT}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=${BT}" >> "$GITHUB_ENV"
          echo "构建时间戳: ${BT}"
          echo "目标版本: App ${NAME}(${CODE}) · 模块 ${MNAME}(${MCODE}) · tag v${NAME}"

      # 改版本号：versionName 与 versionCode 都用上一步算好的值
      # versionCode 必须递增 否则新包装不上（覆盖安装会失败）
      - name: Bump version in build.gradle.kts
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          sed -i -E "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${VERSION}\"/" "$FILE"
          sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${CODE}/" "$FILE"
          echo "versionName -> ${VERSION} versionCode -> ${CODE}"
          grep -nE 'versionCode|versionName' "$FILE"

      # 模块版本写回 module/main/module.prop：打包脚本读的就是它，
      # 这样产物里的 module.prop 和仓库里的一致，下次发版也能接着往上加
      - name: Bump module version
        if: steps.version.outputs.module_bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.module_name }}
          CODE: ${{ steps.version.outputs.module_code }}
        run: |
          set -euo pipefail
          FILE=module/main/module.prop
          awk -v v="$VERSION" 'index($0, "version=") == 1 { print "version=" v; next } { print }' \
            "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          awk -v c="$CODE" 'index($0, "versionCode=") == 1 { print "versionCode=" c; next } { print }' \
            "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          grep -nE '^version|^versionCode' "$FILE"

      # README 的「基本信息」表里露出版本号 每次发版跟着一起改
      # 找不到那一行就直接失败 免得机制悄悄失效 —— 改了那行的写法记得同步这里的正则
      - name: Sync README version
        id: readme
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib

          version = os.environ["VERSION"]
          code = os.environ["CODE"]
          p = pathlib.Path("README.md")
          src = p.read_text(encoding="utf-8")

          # README 里只露版本名 代号是发布时才关心的东西 不往用户看的表里放
          pat = re.compile(r"(\|\s*\*\*当前版本\*\*\s*\|\s*)`[^`]*`")
          new, n = pat.subn(lambda m: f"{m.group(1)}`{version}`", src)
          if n == 0:
              raise SystemExit(
                  "README.md 里没找到「当前版本」那一行 —— "
                  "格式被改过了？同步修一下这一步的正则"
              )
          p.write_text(new, encoding="utf-8")

          changed = "true" if new != src else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"changed={changed}\n")
          print(f"README 当前版本 -> {version} changed={changed}")
          PY

      # update.md 的写法：顶部永远是一个 ## latest 段，开发中的改动都往里加
      # 发版这一刻把 ## latest 就地改名成 ## v<版本> 更新，再在最顶上插入一个新的空 latest
      # 好处是「写日志」和「发版」彻底解耦：平时只往 latest 里追加，发版不用回头改标题
      - name: Finalize changelog
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          MODULE_VERSION: ${{ steps.version.outputs.module_name }}
        run: |
          set -euo pipefail

          # ---- 应用 ----
          if sh scripts/changelog.sh has update.md latest; then
            sh scripts/changelog.sh finalize update.md "${VERSION}"
          elif sh scripts/changelog.sh has update.md "${VERSION}"; then
            # 重发同一版本时 latest 已经被上次发版清空，直接复用已归档的段落
            echo "update.md 的 latest 为空，复用已归档的 v${VERSION} 段（重发同一版本）"
          else
            echo "::error::update.md 的 ## latest 段没有内容 —— 发布前先把这次改动写进去"
            exit 1
          fi

          # ---- 模块 ----
          # 模块允许这一版不发：latest 为空且没有对应段落时跳过，不阻断 App 发版
          if sh scripts/changelog.sh has module/main/update.md latest; then
            sh scripts/changelog.sh finalize module/main/update.md "${MODULE_VERSION}"
          else
            echo "模块 update.md 的 latest 为空，本次 Release 不附模块日志"
          fi

          echo "--- update.md 顶部 ---"
          sed -n '1,12p' update.md
          echo "--- module/main/update.md 顶部 ---"
          sed -n '1,12p' module/main/update.md

      # 模块包和 App 一起发：打包逻辑只维护在 module/打包.sh 一份，
      # 本地跑同一条命令 产出完全一样的 zip（--keep 表示不改源码里的版本号）
      - name: Build module zip
        id: module
        run: |
          set -euo pipefail
          sh module/打包.sh --keep
          SRC=$(ls -1 module/dist/*.zip | tail -1)
          mkdir -p dist
          ZIP="dist/systemui_mount-v${{ steps.version.outputs.module_name }}.zip"
          cp "$SRC" "$ZIP"
          {
            echo "module_zip=${ZIP}"
            echo "module_file=${ZIP##*/}"
          } >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "模块包: ${ZIP}"
          ls -l "$ZIP"

      # 密码通过环境变量传给 Gradle（build.gradle.kts 读取）
      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -PbuildTime=${{ steps.version.outputs.build_time }}

      # 确认密钥真的用上了：没签名的包也能构建出来 只有验证过才算数
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS=$(ls -d "${SDK_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${TOOLS}" ] && [ -x "${TOOLS}apksigner" ]; then
            "${TOOLS}apksigner" verify --print-certs "${APK}"
            echo "apksigner 验证通过"
          else
            # 没有 apksigner 时退化为检查 Jar 签名块
            if ! unzip -l "${APK}" | grep -q "META-INF/.*\.RSA"; then
              echo "::error::产物未签名（缺少 META-INF/*.RSA）"
              exit 1
            fi
            echo "签名校验通过（存在 META-INF/*.RSA）"
          fi

      # 产物改名：HyperMount-arm64-<版本>.apk
      # 签名校验用未改名的原文件 校验通过后再复制成发布用的名字
      - name: Rename APK
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/HyperMount-arm64-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "发布产物: ${OUT}"
          ls -l "$OUT"

      # 构建成功后再提交版本号与日志改动 避免构建失败留下一半的脏提交
      # 日志归档（## latest → ## v<版本>）也在这里一起进仓库 保证 tag 里的 update.md 是归档后的
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          MODULE_VERSION: ${{ steps.version.outputs.module_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts module/main/module.prop README.md update.md module/main/update.md
          if git diff --cached --quiet; then
            echo "版本文件与日志无变化（可能本来就是该版本） 跳过提交"
            exit 0
          fi
          git commit -m "chore(release): 版本号 ${VERSION} / 模块 ${MODULE_VERSION}"
          git push origin HEAD:main

      # 幂等：同一版本一键重发时 先删掉旧 tag 再打新的
      - name: Create / update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}" 2>/dev/null || true
            git tag -d "${TAG}" 2>/dev/null || true
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      # Release 说明由两段拼成：应用段 + 模块段
      # 应用段取自 update.md 里 ## v<版本> 更新（上一步刚从 latest 归档出来的）
      # 模块段取自 module/main/update.md 的同名段落，模块这版没改动就整段省略
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          MODULE_VERSION: ${{ steps.version.outputs.module_name }}
        run: |
          set -euo pipefail

          # 去掉段首段尾的空行，段与段之间统一只留一个空行
          trim() {
            awk '
              { line[NR] = $0 }
              END {
                start = 1; end = NR
                while (start <= end && line[start] ~ /^[[:space:]]*$/) start++
                while (end >= start && line[end] ~ /^[[:space:]]*$/) end--
                for (i = start; i <= end; i++) print line[i]
              }'
          }

          # 段内的小节标题（### 修复 / ### 更改）本来是挂在 ## vX 底下的
          # 拼进 Release 说明时外面又套了一层 ### 应用 · vX 原样输出会变成两组平级标题
          # 这里统一降一级 让它正确挂在版本标题下面
          demote() { sed -E 's/^### /#### /'; }

          sh scripts/changelog.sh extract update.md "${VERSION}" | trim | demote > app_changelog.md
          sh scripts/changelog.sh has module/main/update.md "${MODULE_VERSION}" \
            && sh scripts/changelog.sh extract module/main/update.md "${MODULE_VERSION}" | trim | demote > module_changelog.md \
            || : > module_changelog.md

          : > release_notes.md
          if [ -s app_changelog.md ]; then
            {
              echo "### 应用 · v${VERSION}"
              echo
              cat app_changelog.md
            } > release_notes.md
          fi

          if [ -s module_changelog.md ]; then
            {
              echo
              echo "### 模块 · v${MODULE_VERSION}"
              echo
              cat module_changelog.md
            } >> release_notes.md
          fi

          if [ -s release_notes.md ]; then
            echo "--- 本次 Release 说明 ---"
            cat release_notes.md
          else
            echo "update.md 里没有这个版本的段落 本次 Release 不带说明"
          fi

      # 构建完直接发布 Release 附带签名 APK 和模块 zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          files: |
            dist/HyperMount-arm64-${{ steps.version.outputs.version_name }}.apk
            ${{ steps.module.outputs.module_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布完把仓库根的 update.json 指到这次 Release
      # App 启动检查更新读的就是 main 上这份清单：
      # versionCode 取 build.gradle.kts（已经 bump 过） 地址直接拼本次 tag 的 APK 资产
      # changelog 取 app_changelog.md（update.md 里本次版本的段落本身）
      # 不从 release_notes.md 抠：那份说明里已经混进了模块段和 ### 标题
      - name: Update update.json
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          MODULE_VERSION: ${{ steps.version.outputs.module_name }}
          MODULE_CODE: ${{ steps.version.outputs.module_code }}
          MODULE_FILE: ${{ steps.module.outputs.module_file }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
        run: |
          set -euo pipefail
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          URL="https://github.com/${REPO}/releases/download/${TAG}/HyperMount-arm64-${VERSION}.apk"
          MODULE_URL="https://github.com/${REPO}/releases/download/${TAG}/${MODULE_FILE}"
          export CODE URL MODULE_URL
          python3 - <<'PY'
          import json, os, re

          def read_lines(path):
              """把 update.md 段落里的 - 列表项压成一行一条的纯文本

              分组标题（### 修复 / ### 更改）不进清单：
              应用内的更新卡片是按行纯文本渲染的 带 # 的标题会原样显示成一条内容
              条目前的动词（修复 / 优化 / 添加 / 替换）本身已经分了类
              """
              lines = []
              if os.path.exists(path):
                  for raw in open(path, encoding="utf-8"):
                      s = raw.strip()
                      if not s or s.startswith("#"):
                          continue
                      lines.append(re.sub(r"^[-*]\s+", "", s))
              return "\n".join(lines)

          data = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": os.environ["VERSION"],
              # 构建时间戳：App 拿它跟手上那份比 比清单晚就是有更新
              "buildTime": int(os.environ["BUILD_TIME"]),
              "url": os.environ["URL"],
              # 应用日志取 update.md 里本次版本的段落（不是从 Release 说明里抠，避免混进模块段）
              "changelog": read_lines("app_changelog.md"),
              # 模块挂在同一个 Release 里，官网「先装模块」卡片与关于页模块更新卡读这三项
              "moduleVersionCode": int(os.environ["MODULE_CODE"]),
              "moduleVersionName": os.environ["MODULE_VERSION"],
              "moduleUrl": os.environ["MODULE_URL"],
              # 模块这版没有日志就是空串，App 端会自动回落到「见 Release 页面」
              "moduleChangelog": read_lines("module_changelog.md"),
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open("update.json", encoding="utf-8").read())
          # Magisk 自己的更新清单：module.prop 里的 updateJson 指向这份
          # 装过正式模块的机器在 Magisk 里能直接看到并升级
          magisk = {
              "version": os.environ["MODULE_VERSION"],
              "versionCode": int(os.environ["MODULE_CODE"]),
              "zipUrl": os.environ["MODULE_URL"],
              "changelog": "https://raw.githubusercontent.com/%s/main/module/main/update.md"
                           % os.environ["REPO"],
          }
          with open("module-update.json", "w", encoding="utf-8") as f:
              json.dump(magisk, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open("module-update.json", encoding="utf-8").read())
          PY
          # 官网也是读同一份清单：页面上「下载 / 版本号」都从这里取
          # 放在站点 public/ 下 部署后同域请求 不受 GitHub 直连影响
          cp update.json docs/public/update.json

      # 清单改动提交回 main：推送被拒（别人刚好也推了）就 rebase 重试
      - name: Commit update.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json docs/public/update.json module-update.json
          if git diff --cached --quiet; then
            echo "update.json 没有变化 跳过提交"
            exit 0
          fi
          git commit -m "chore(release): update.json 指向 ${TAG}"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "update.json 已推送到 main"
              exit 0
            fi
            echo "推送被拒 第 ${i} 次重试…"
            # 用 rebase 而不是 pull：checkout 可能是 detached HEAD pull 会直接报错
            git fetch origin main
            git rebase --autostash FETCH_HEAD
          done
          echo "::error::update.json 推送失败"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HyperMount-arm64
          path: dist/HyperMount-arm64-*.apk

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: systemui_mount-module
          path: module/dist/*.zip

  # 发版收尾：update.json 已在本轮推到 main 这里紧接着重建官网
  # 用 GITHUB_TOKEN 推送的 commit 不会再触发 push 事件 所以只能主动调用
  # 站点构建逻辑只有 pages.yml 一份 这里复用 不复制粘贴
  site:
    name: Deploy Site
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
